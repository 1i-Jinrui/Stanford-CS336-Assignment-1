
# ------------------------------------------------------------
# 数据与 tokenizer 文件路径
# ------------------------------------------------------------

train_data_path: "../data/owt_train.txt"
valid_data_path: "../data/owt_valid.txt"

vocab_path: "../bpe/owt_vocab.json"
merges_path: "../bpe/owt_merges.txt"

# ------------------------------------------------------------
# checkpoint 相关参数
# ------------------------------------------------------------

output_dir: "./checkpoints"

# 训练恢复用；如果从头训练，保持 null
resume_from: null

# 推理/验证时加载的 checkpoint
checkpoint_path: "./checkpoints/owt/d512_l4_h16_ctx512_bs32_lr1e-03_seed42_30000step/checkpoint_final.pt"

# ------------------------------------------------------------
# 设备设置
# ------------------------------------------------------------

device: "cpu"
seed: 42

# ------------------------------------------------------------
# Transformer Language Model 结构参数
# ------------------------------------------------------------

model:
  vocab_size: 32000
  context_length: 512
  d_model: 512
  num_layers: 4
  num_heads: 16
  d_ff: 1344
  rope_theta: 10000.0

# ------------------------------------------------------------
# 训练过程参数
# ------------------------------------------------------------

training:
  batch_size: 32
  max_iters: 30000
  warmup_iters: 2000

# ------------------------------------------------------------
# AdamW 优化器与学习率参数
# ------------------------------------------------------------

optimizer:
  max_lr: 1e-3
  min_lr: 1e-4
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1e-8

# ------------------------------------------------------------
# 梯度裁剪
# ------------------------------------------------------------

max_grad_norm: 1.0

# ------------------------------------------------------------
# 日志与保存
# ------------------------------------------------------------

log_interval: 10
save_interval: 1000

# ------------------------------------------------------------
# 验证集评估参数
# ------------------------------------------------------------

eval_batch_size: 32

# null 表示评估完整验证集
max_eval_batches: null

# ------------------------------------------------------------
# 文本生成参数
# ------------------------------------------------------------

prompt: "On a quiet coast, there stood a small lighthouse"

# 至少生成 256 tokens 或直到 <|endoftext|>
max_new_tokens: 512

# 越低越保守，越高越随机
temperature: 0.8

# nucleus sampling 阈值
top_p: 0.9

# 生成停止 token
eos_token: "<|endoftext|>"